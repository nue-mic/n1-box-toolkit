name: build & release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            builder: '--win --x64'
          - os: macos-latest
            arch: arm64
            adb: mac
            builder: '--mac --arm64'
          - os: macos-13
            arch: x64
            adb: mac
            builder: '--mac --x64'
          - os: ubuntu-latest
            arch: x64
            adb: linux
            builder: '--linux --x64'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Fetch platform adb (mac/linux)
        if: ${{ matrix.adb != '' }}
        run: npm run fetch-adb -- ${{ matrix.adb }}

      - name: Build (electron-vite)
        run: npm run build

      - name: Package (electron-builder)
        run: npx --no-install electron-builder ${{ matrix.builder }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: n1-onekey-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: warn
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
