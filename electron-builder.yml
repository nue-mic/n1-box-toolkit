appId: com.n1onekey.app
productName: N1 OneKey
copyright: N1 OneKey

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

asar: true
# ssh2 的可选原生依赖 cpu-features 不参与构建：不重建原生模块、把任何 .node 解出 asar，ssh2 会自动回退纯 JS
asarUnpack:
  - '**/*.node'
npmRebuild: false
# 不签名（个人本地使用）—— 客户端 verifyUpdateCodeSignature 已显式接受无签名
forceCodeSigning: false

# electron-updater 工作必备：生成 latest.yml（含 SHA512、版本、安装包文件名）与 *.blockmap（差量更新元数据）。
# url 仅用于 electron-builder 在 latest.yml 内写默认下载基址，运行时我们用自定义 Provider 走自建代理多域名 fallback，
# 因此这里写一个稳定占位（用主代理域名）即可，CI 不调用 electron-builder publish，产物仍由 softprops 上传至 GitHub Release。
publish:
  - provider: generic
    url: https://gh-raw.966788.xyz/n1-box-releases
    channel: latest

# 打包后校验 adb 资源 / 补可执行位 / mac ad-hoc 签名内置二进制
afterPack: scripts/afterPack.cjs

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  extraResources:
    - from: resources/adb/win
      to: adb
    - from: resources/boot
      to: boot

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: ${productName}-${version}-setup-${arch}.${ext}

# 免安装便携版：单个 exe，双击即用（运行时自解压到临时目录）
portable:
  artifactName: ${productName}-${version}-portable-${arch}.${ext}

mac:
  category: public.app-category.utilities
  hardenedRuntime: false
  identity: null
  target:
    - target: dmg
    - target: zip
  extraResources:
    - from: resources/adb/mac
      to: adb
    - from: resources/boot
      to: boot
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

linux:
  category: Utility
  maintainer: mia-clark <mia-clark@users.noreply.github.com>
  target:
    - AppImage
    - deb
  extraResources:
    - from: resources/adb/linux
      to: adb
    - from: resources/boot
      to: boot
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
