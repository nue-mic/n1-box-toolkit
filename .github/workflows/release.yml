name: build & release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            builder: '--win --x64'
          - os: macos-latest
            arch: arm64
            adb: mac
            builder: '--mac --arm64'
          # 注：已移除 macos-13 (Intel) —— GitHub 免费 Intel mac 运行器紧缺、常排队卡住，拖累整体发布；
          # 现 Mac 绝大多数为 Apple Silicon(arm64)，如需 Intel 覆盖可改用 macos-latest + '--mac --universal'。
          - os: ubuntu-latest
            arch: x64
            adb: linux
            builder: '--linux --x64'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Fetch platform adb (mac/linux)
        if: ${{ matrix.adb != '' }}
        run: npm run fetch-adb -- ${{ matrix.adb }}

      - name: Build (electron-vite)
        run: npm run build

      - name: Package (electron-builder)
        run: npx --no-install electron-builder ${{ matrix.builder }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: n1-box-toolkit-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: warn
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb

  # 汇总所有平台产物，自动发布：
  #  - 推送 tag v* -> 正式版本 Release
  #  - 推送 main / 手动触发 -> 滚动更新的 latest 预发布（始终有最新可下载包，无需手动操作）
  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Decide release tag
        id: rel
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "title=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "title=Latest build (main)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.title }}
          prerelease: ${{ steps.rel.outputs.prerelease }}
          fail_on_unmatched_files: false
          files: dist/**/*
