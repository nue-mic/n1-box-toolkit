name: build & release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            builder: '--win --x64'
          - os: macos-latest
            arch: arm64
            adb: mac
            builder: '--mac --arm64'
          # 注：已移除 macos-13 (Intel) —— GitHub 免费 Intel mac 运行器紧缺、常排队卡住，拖累整体发布；
          # 现 Mac 绝大多数为 Apple Silicon(arm64)，如需 Intel 覆盖可改用 macos-latest + '--mac --universal'。
          - os: ubuntu-latest
            arch: x64
            adb: linux
            builder: '--linux --x64'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Fetch platform adb (mac/linux)
        if: ${{ matrix.adb != '' }}
        run: npm run fetch-adb -- ${{ matrix.adb }}

      - name: Build (electron-vite)
        run: npm run build

      - name: Package (electron-builder)
        run: npx --no-install electron-builder ${{ matrix.builder }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: n1-box-toolkit-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: warn
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb

  # 汇总所有平台产物，全自动发布为【正式 Release】（不再用 pre-release）：
  #  - 推送 tag v* -> 用该 tag 名发布
  #  - 推送 main / 手动触发 -> 读 package.json 版本号，发布为 v<版本> 正式 Release，并标记为 Latest
  #  每个版本号一个独立 Release，互不覆盖、不堆积旧资产（配合 build 脚本的自增版本号）
  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (读取 package.json 版本号)
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Decide release tag
        id: rel
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # 推送 v* 标签：直接用标签名
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "title=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # 推送 main / 手动触发：读 package.json 版本号，发 v<版本> 正式版
            ver=$(node -p "require('./package.json').version")
            echo "tag=v${ver}" >> "$GITHUB_OUTPUT"
            echo "title=v${ver}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.title }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
          files: dist/**/*
