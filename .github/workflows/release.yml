name: build & release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 发布流程含「回写版本号到 main + 发 tag」副作用，不能被后到的 push 中途取消（否则版本号被消耗却无 Release）→ 排队而非取消
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 自动版本号：推 main / 手动触发 -> patch 自增并回写 main（GITHUB_TOKEN 推送不会再触发本流程，[skip ci] 双保险），
  # 输出 v<版本> 供后续构建与发布使用；推 v* 标签时不自增，直接用标签名。
  version:
    name: bump version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump & decide tag
        id: v
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            npm version patch --no-git-tag-version
            ver=$(node -p "require('./package.json').version")
            git commit -am "chore(release): v${ver} [skip ci]"
            git push origin HEAD:main
            echo "tag=v${ver}" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build (${{ matrix.os }} ${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            builder: '--win --x64'
          - os: macos-latest
            arch: arm64
            adb: mac
            builder: '--mac --arm64'
          # 注：已移除 macos-13 (Intel) —— GitHub 免费 Intel mac 运行器紧缺、常排队卡住，拖累整体发布；
          # 现 Mac 绝大多数为 Apple Silicon(arm64)，如需 Intel 覆盖可改用 macos-latest + '--mac --universal'。
          - os: ubuntu-latest
            arch: x64
            adb: linux
            builder: '--linux --x64'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Fetch platform adb (mac/linux)
        if: ${{ matrix.adb != '' }}
        run: npm run fetch-adb -- ${{ matrix.adb }}

      - name: Build (electron-vite)
        run: npm run build

      - name: Package (electron-builder)
        run: npx --no-install electron-builder ${{ matrix.builder }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: n1-box-toolkit-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: warn
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb

  # 汇总所有平台产物，全自动发布为【正式 Release】并标记 Latest；版本号来自 version job（每次推送自增）。
  release:
    name: publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ needs.version.outputs.sha }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: dist/**/*
